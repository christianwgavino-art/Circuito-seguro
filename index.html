<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>Circuito Seguro - Dashboard</title>
<style>
:root {
  --navy:#16324f;
  --navy2:#214b70;
  --bg:#f4f7fa;
  --card:#fff;
  --line:#dbe4ec;
  --text:#1f2937;
  --muted:#667085;
  --green:#23864a;
  --green-soft:#e9f7ef;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:white;padding:22px 16px 18px;
}
.wrap{max-width:980px;margin:auto}
h1{margin:0;font-size:28px}
.subtitle{margin-top:6px;opacity:.85;font-size:14px}
main{padding:16px}
.kpis{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-bottom:12px
}
.kpi{
  background:white;border:1px solid var(--line);
  border-radius:14px;padding:14px;text-align:center
}
.kpi .label{font-size:11px;color:var(--muted);font-weight:bold}
.kpi .value{font-size:26px;font-weight:bold;color:var(--navy);margin-top:4px}
.progress-card{
  background:white;border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:14px
}
.progress-row{display:flex;justify-content:space-between;font-weight:bold}
.progress{height:11px;background:#e7edf3;border-radius:999px;overflow:hidden;margin-top:9px}
.progress div{height:100%;background:var(--green);width:0%;transition:.2s}
.controls{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px
}
.controls input{grid-column:1/-1}
input,select,button{
  width:100%;padding:12px;border:1px solid var(--line);
  border-radius:11px;background:white;font-size:15px
}
button{font-weight:bold;color:var(--navy)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px}
.tabs button{width:auto;white-space:nowrap;padding:9px 12px}
.tabs button.active{background:var(--navy);color:white;border-color:var(--navy)}
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:grid;grid-template-columns:1fr auto;gap:12px;
  align-items:center;background:white;border:1px solid var(--line);
  border-radius:13px;padding:13px
}
.item.done{background:var(--green-soft);border-color:#b9dfc6}
.name{font-weight:bold;color:var(--navy);font-size:16px}
.addr{font-size:14px;color:var(--muted);margin-top:4px}
.chk{width:28px;height:28px;accent-color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:24px}
.note{text-align:center;color:var(--muted);font-size:12px;padding:18px 0}
@media(max-width:520px){
  h1{font-size:24px}
  .kpi{padding:11px 6px}
  .kpi .value{font-size:22px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Circuito Seguro</h1>
    <div class="subtitle">Recorrida de comercios · San Isidro</div>
  </div>
</header>

<main class="wrap">
  <div class="kpis">
    <div class="kpi"><div class="label">TOTAL</div><div class="value" id="total">71</div></div>
    <div class="kpi"><div class="label">VISITADOS</div><div class="value" id="done">0</div></div>
    <div class="kpi"><div class="label">PENDIENTES</div><div class="value" id="pending">71</div></div>
  </div>

  <div class="progress-card">
    <div class="progress-row">
      <span>Avance</span><span id="percent">0%</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
  </div>

  <div class="controls">
    <input type="search" id="search" placeholder="Buscar comercio o dirección...">
    <select id="status">
      <option value="all">Todos</option>
      <option value="pending">Pendientes</option>
      <option value="done">Visitados</option>
    </select>
    <button id="reset">Reiniciar marcas</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>

  <div class="note">Las marcas quedan guardadas en este dispositivo y navegador.</div>
</main>

<script>
const shops = [{"direccion": "25 DE MAYO 48", "fantasia": "ISIDRO", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 210", "fantasia": "COPYGOT", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 233", "fantasia": "WINDEX", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 272", "fantasia": "ANDY BAKE SHOP", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 309", "fantasia": "CAROLINA BRUSA HOME", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 324", "fantasia": "BILLY GUNS", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 371", "fantasia": "CHILY", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 519", "fantasia": "MAXIKIOSCO ISIS", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 527", "fantasia": "LA ESPAÑOLA", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 557", "fantasia": "MALEVOS BARBER", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 584", "fantasia": "TOFFEE PASTELERIA", "calle": "25 DE MAYO"}, {"direccion": "25 DE MAYO 600", "fantasia": "SPS seguridad electronica", "calle": "25 DE MAYO"}, {"direccion": "9 DE JULIO 305", "fantasia": "ALMA", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 311", "fantasia": "Extra large", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 319", "fantasia": "LA ESTRELLA", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 320", "fantasia": "TANNA DE ALMA", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 334", "fantasia": "BLANCOMAR", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 358", "fantasia": "NARANJO", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 361", "fantasia": "ASH", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 363", "fantasia": "COCO NARANJA", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 367", "fantasia": "BONAFIDE", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 368", "fantasia": "CALZADO LA CALESITA", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 385", "fantasia": "ATICO MULTIMARCA", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 399", "fantasia": "FREDDO", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 400", "fantasia": "DELICITY", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 402", "fantasia": "Gross", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 422", "fantasia": "ZONA COTILLÓN", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 441", "fantasia": "PEQUE Y COCO", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 457", "fantasia": "YOGURTMANIA", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 473", "fantasia": "SABOR CASERO", "calle": "9 DE JULIO"}, {"direccion": "9 DE JULIO 476", "fantasia": "LIBRERÍA SIMONITA", "calle": "9 DE JULIO"}, {"direccion": "BELGRANO 33", "fantasia": "LA BOMBA", "calle": "BELGRANO"}, {"direccion": "BELGRANO 42", "fantasia": "B40", "calle": "BELGRANO"}, {"direccion": "BELGRANO 201", "fantasia": "LA BICICLETA", "calle": "BELGRANO"}, {"direccion": "BELGRANO 205", "fantasia": "FRANFRELUCH", "calle": "BELGRANO"}, {"direccion": "BELGRANO 209", "fantasia": "RUMORE", "calle": "BELGRANO"}, {"direccion": "BELGRANO 219", "fantasia": "ADVANCED", "calle": "BELGRANO"}, {"direccion": "BELGRANO 222", "fantasia": "Love Chuka", "calle": "BELGRANO"}, {"direccion": "BELGRANO 229", "fantasia": "FELICITAS", "calle": "BELGRANO"}, {"direccion": "BELGRANO 239", "fantasia": "ISADORA", "calle": "BELGRANO"}, {"direccion": "BELGRANO 254", "fantasia": "La Nueva Reina", "calle": "BELGRANO"}, {"direccion": "BELGRANO 258", "fantasia": "hausbrot", "calle": "BELGRANO"}, {"direccion": "BELGRANO 263", "fantasia": "STARBUCKS", "calle": "BELGRANO"}, {"direccion": "BELGRANO 269", "fantasia": "BURGER KING", "calle": "BELGRANO"}, {"direccion": "BELGRANO 289", "fantasia": "COMPAÑÍA DE GOLOSINAS", "calle": "BELGRANO"}, {"direccion": "BELGRANO 300", "fantasia": "SANTA CLAUS", "calle": "BELGRANO"}, {"direccion": "BELGRANO 329", "fantasia": "ALEX COFFEE ROASTERS", "calle": "BELGRANO"}, {"direccion": "BELGRANO 333 - Local 01", "fantasia": "LA VOLUNTAD", "calle": "BELGRANO"}, {"direccion": "BELGRANO 333 - Local 12", "fantasia": "LAS SANTIN const STORAGE = "circuito_seguro_dashboard_v2";
let checked = JSON.parse(localStorage.getItem(STORAGE) || "{}");
let activeStreet = "TODAS";

const streets = ["TODAS","25 DE MAYO","9 DE JULIO","BELGRANO","CHACABUCO"];
const keyOf = s => s.direccion + "||" + s.fantasia;

function save() {
  localStorage.setItem(STORAGE, JSON.stringify(checked));
}

function updateStats() {
  const total = shops.length;
  const done = shops.filter(s => !!checked[keyOf(s)]).length;
  const pending = total - done;
  const pct = total ? Math.round(done * 100 / total) : 0;
  totalEl.textContent = total;
  doneEl.textContent = done;
  pendingEl.textContent = pending;
  percent.textContent = pct + "%";
  bar.style.width = pct + "%";
}

function renderTabs() {
  tabs.innerHTML = "";
  streets.forEach(st => {
    const b = document.createElement("button");
    b.textContent = st === "TODAS" ? "Todas" : st;
    if (st === activeStreet) b.classList.add("active");
    b.onclick = () => {
      activeStreet = st;
      renderTabs();
      renderList();
    };
    tabs.appendChild(b);
  });
}

function renderList() {
  const q = search.value.trim().toLowerCase();
  const state = status.value;
  const filtered = shops.filter(s => {
    const done = !!checked[keyOf(s)];
    const streetOK = activeStreet === "TODAS" || s.calle === activeStreet;
    const queryOK = !q || (s.fantasia + " " + s.direccion).toLowerCase().includes(q);
    const statusOK = state === "all" || (state === "done" ? done : !done);
    return streetOK && queryOK && statusOK;
  });

  list.innerHTML = "";
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No hay resultados.</div>';
    return;
  }

  filtered.forEach(s => {
    const k = keyOf(s);
    const done = !!checked[k];
    const row = document.createElement("label");
    row.className = "item" + (done ? " done" : "");
    row.innerHTML = `
      <div>
        <div class="name">${s.fantasia}</div>
        <div class="addr">${s.direccion}</div>
      </div>
      <input class="chk" type="checkbox" ${done ? "checked" : ""}>
    `;
    const cb = row.querySelector("input");
    cb.onchange = () => {
      if (cb.checked) checked[k] = true;
      else delete checked[k];
      save();
      updateStats();
      renderList();
    };
    list.appendChild(row);
  });
}

const totalEl = document.getElementById("total");
const doneEl = document.getElementById("done");
const pendingEl = document.getElementById("pending");
const percent = document.getElementById("percent");
const bar = document.getElementById("bar");
const tabs = document.getElementById("tabs");
const list = document.getElementById("list");
const search = document.getElementById("search");
const status = document.getElementById("status");
const reset = document.getElementById("reset");

search.addEventListener("input", renderList);
status.addEventListener("change", renderList);
reset.addEventListener("click", () => {
  if (confirm("¿Borrar todas las marcas?")) {
    checked = {};
    save();
    updateStats();
    renderList();
  }
});

renderTabs();
updateStats();
renderList();
</script>
</body>
</html>
