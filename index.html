<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>Circuito Seguro - Dashboard</title>
<style>
:root{--navy:#16324f;--navy2:#214b70;--bg:#f4f7fa;--card:#fff;--line:#dbe4ec;--text:#1f2937;--muted:#667085;--green:#23864a;--green-soft:#e9f7ef;--red:#b42318;--amber:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:20px 16px 17px}.wrap{max-width:980px;margin:auto}.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{margin:0;font-size:28px}.subtitle{margin-top:5px;opacity:.85;font-size:14px}.online{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:8px 10px;border-radius:999px;font-size:12px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#f5b942}.online.ok .dot{background:#55d187}.online.bad .dot{background:#ff756f}main{padding:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}.label{font-size:11px;color:var(--muted);font-weight:bold}.value{font-size:24px;font-weight:bold;color:var(--navy);margin-top:3px}.progress-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.progress-row{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}.progress{height:10px;background:#e7edf3;border-radius:999px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:var(--green);width:0%;transition:.25s}.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:9px}.controls input{grid-column:1/-1}input,select,button{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}input,select{width:100%}button{font-weight:bold;color:var(--navy);cursor:pointer}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px}.tabs button{white-space:nowrap}.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.list{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;transition:.2s}.item.done{background:var(--green-soft);border-color:#b9dfc6}.item.saving{opacity:.65}.name{font-weight:bold;color:var(--navy);font-size:16px}.addr{font-size:14px;color:var(--muted);margin-top:3px}.checkwrap{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted)}.chk{width:28px;height:28px;accent-color:var(--green)}.message{text-align:center;color:var(--muted);padding:28px 10px;background:#fff;border:1px solid var(--line);border-radius:12px}.message.error{color:var(--red)}.foot{text-align:center;color:var(--muted);font-size:11px;padding:16px 0 7px}.syncnote{font-size:11px;color:var(--muted);text-align:right;margin:4px 2px 10px}@media(max-width:520px){h1{font-size:23px}.headrow{align-items:center}.online{font-size:11px;padding:7px 9px}.kpi{padding:10px 5px}.value{font-size:21px}}
</style>
</head>
<body>
<header><div class="wrap headrow"><div><h1>Circuito Seguro</h1><div class="subtitle">Recorrida compartida de comercios</div></div><div id="online" class="online"><span class="dot"></span><span id="onlineText">Conectando...</span></div></div></header>
<main class="wrap">
<div class="kpis"><div class="kpi"><div class="label">TOTAL</div><div class="value" id="total">—</div></div><div class="kpi"><div class="label">VISITADOS</div><div class="value" id="done">—</div></div><div class="kpi"><div class="label">PENDIENTES</div><div class="value" id="pending">—</div></div></div>
<div class="progress-card"><div class="progress-row"><span>Avance</span><span id="percent">0%</span></div><div class="progress"><div id="bar"></div></div></div>
<div class="controls"><input id="search" type="search" placeholder="Buscar comercio o dirección..."><select id="status"><option value="all">Todos</option><option value="pending">Pendientes</option><option value="done">Visitados</option></select><button id="refresh">Actualizar</button></div>
<div id="syncnote" class="syncnote">Actualización automática cada 5 segundos</div>
<div id="tabs" class="tabs"></div><div id="list" class="list"><div class="message">Cargando recorrida...</div></div>
<div class="foot">Todos los celulares usan el mismo estado guardado en Google Sheets.</div>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyTLOjUOr94JEvpKZqAdb-FxV0BfMU5dwyaGWhcv4ReIawupyIPRksmsKEkhRShiCeFtg/exec';
let shops=[];let activeStreet='TODAS';let loading=false;let savingRows=new Set();
const streets=['TODAS','25 DE MAYO','9 DE JULIO','BELGRANO','CHACABUCO'];
const $=id=>document.getElementById(id);
function streetOf(d){const x=String(d||'').toUpperCase();for(const s of streets.slice(1))if(x.startsWith(s+' '))return s;return 'OTRA'}
function jsonp(params,timeout=12000){return new Promise((resolve,reject)=>{const cb='cs_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let timer;const cleanup=()=>{clearTimeout(timer);try{delete window[cb]}catch(e){}script.remove()};window[cb]=data=>{cleanup();resolve(data)};params.callback=cb;params._=Date.now();script.src=API_URL+'?'+new URLSearchParams(params).toString();script.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con Google Sheets'))};timer=setTimeout(()=>{cleanup();reject(new Error('La conexión tardó demasiado'))},timeout);document.body.appendChild(script)})}
function setOnline(mode,text){const el=$('online');el.className='online'+(mode?' '+mode:'');$('onlineText').textContent=text}
function stats(){const total=shops.length,done=shops.filter(s=>s.visited).length,p=total-done,pct=total?Math.round(done*100/total):0;$('total').textContent=total;$('done').textContent=done;$('pending').textContent=p;$('percent').textContent=pct+'%';$('bar').style.width=pct+'%'}
function renderTabs(){$('tabs').innerHTML='';streets.forEach(st=>{const b=document.createElement('button');b.textContent=st==='TODAS'?'Todas':st;if(st===activeStreet)b.classList.add('active');b.onclick=()=>{activeStreet=st;renderTabs();renderList()};$('tabs').appendChild(b)})}
function renderList(){const q=$('search').value.trim().toLowerCase(),state=$('status').value;const f=shops.filter(s=>(activeStreet==='TODAS'||s.calle===activeStreet)&&(!q||(s.fantasia+' '+s.direccion).toLowerCase().includes(q))&&(state==='all'||(state==='done'?s.visited:!s.visited)));const list=$('list');list.innerHTML='';if(!f.length){list.innerHTML='<div class="message">No hay comercios para mostrar.</div>';return}f.forEach(s=>{const card=document.createElement('div');const saving=savingRows.has(s.row);card.className='item'+(s.visited?' done':'')+(saving?' saving':'');card.innerHTML=`<div><div class="name">${escapeHtml(s.fantasia)}</div><div class="addr">${escapeHtml(s.direccion)}</div></div><label class="checkwrap"><input class="chk" type="checkbox" ${s.visited?'checked':''} ${saving?'disabled':''}><span>${saving?'Guardando...':'Visitado'}</span></label>`;const cb=card.querySelector('input');cb.onchange=()=>changeVisit(s,cb.checked);list.appendChild(card)})}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
async function loadData(silent=false){if(loading)return;loading=true;if(!silent)setOnline('','Conectando...');try{const d=await jsonp({action:'list'});if(!d||!d.ok)throw new Error(d&&d.error?d.error:'Respuesta inválida');shops=(d.comercios||[]).map(s=>({row:Number(s.row),direccion:String(s.direccion||''),fantasia:String(s.fantasia||''),visited:s.visited===true,calle:streetOf(s.direccion)}));stats();renderTabs();renderList();const t=new Date();setOnline('ok','En línea');$('syncnote').textContent='Última sincronización: '+t.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · automática cada 5 s'}catch(e){setOnline('bad','Sin conexión');if(!shops.length)$('list').innerHTML='<div class="message error">'+escapeHtml(e.message)+'<br>Revisá la implementación de Apps Script.</div>'}finally{loading=false}}
async function changeVisit(shop,value){const previous=shop.visited;shop.visited=value;savingRows.add(shop.row);stats();renderList();try{const d=await jsonp({action:'update',row:String(shop.row),visited:String(value)});if(!d||!d.ok)throw new Error(d&&d.error?d.error:'No se pudo guardar');await loadData(true);setOnline('ok','En línea')}catch(e){shop.visited=previous;setOnline('bad','Error al guardar');alert('No se pudo guardar el cambio. Revisá la conexión y volvé a intentar.');stats()}finally{savingRows.delete(shop.row);renderList()}}
$('search').addEventListener('input',renderList);$('status').addEventListener('change',renderList);$('refresh').addEventListener('click',()=>loadData(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData(true)});
renderTabs();loadData(false);setInterval(()=>{if(!document.hidden&&!savingRows.size)loadData(true)},5000);
</script>
</body></html>
